[package]
name = "dynamic-openapi-client-reqwest"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional native HTTP/1.1 transport for dynamic-openapi-client"
publish = false
readme = "README.md"
repository = "https://github.com/openbindings/openapi-client"

[dependencies]
dynamic-openapi-client = { path = "../client", version = "=0.0.0" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["macros"] }
http = "=1.5.0"
bytes = "=1.12.1"

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-rustls = "=0.26.6"
serde_json.workspace = true
serde.workspace = true
