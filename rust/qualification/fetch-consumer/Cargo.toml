[package]
name = "oac-fetch-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The lifecycle controls read live JSON owners through the unsupported qualification hooks.
dynamic-openapi-client = { version = "=0.0.0", features = ["qualification"] }
dynamic-openapi-client-fetch = "=0.0.0"
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.129"

[profile.release]
lto = "thin"
