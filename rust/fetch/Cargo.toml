[package]
name = "dynamic-openapi-client-fetch"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional finite Fetch transport for dynamic-openapi-client"
publish = false
readme = "README.md"
repository = "https://github.com/openbindings/openapi-client"

[dependencies]
dynamic-openapi-client = { path = "../client", version = "=0.0.0" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
wasm-bindgen-futures = "=0.4.79"
