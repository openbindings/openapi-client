[workspace]
resolver = "3"
members = ["client", "reqwest", "qualification/runner", "qualification/bridge"]
default-members = ["client", "reqwest", "qualification/runner"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[profile.release]
lto = "thin"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
fluent-uri = "=0.4.1"
base64 = "=0.23.1"
