swagger: "2.0"
info:
  title: Files
  version: "1"
host: corpus.example.test
schemes: [https]
paths:
  /files/{name}:
    parameters:
      - name: name
        in: path
        required: true
        type: string
        pattern: "^[a-z]+$"
    get:
      produces: [application/octet-stream, application/json]
      responses:
        200:
          description: the file
          schema:
            type: file
        404:
          description: missing
          schema:
            $ref: "#/definitions/Problem"
    post:
      consumes: [application/x-www-form-urlencoded]
      parameters:
        - name: size
          in: formData
          type: integer
          minimum: 1
          exclusiveMinimum: true
          maximum: 1e6
        - name: digest
          in: formData
          type: string
          format: byte
          required: true
      responses:
        204:
          description: stored
definitions:
  Problem:
    type: object
    required: [status, detail]
    properties:
      status:
        type: integer
        minimum: 400
        maximum: 600
        exclusiveMaximum: true
      detail:
        type: string
        const: "not a Swagger 2.0 keyword"
      instance:
        type: string
        readOnly: true
      trace:
        type: array
        items:
          $ref: "#/definitions/Frame"
    oneOf:
      - $ref: "#/definitions/Frame"
    examples:
      - status: 404
        detail: missing
  Frame:
    type: object
    properties:
      line: {type: integer, minimum: 0}
      parent: {$ref: "#/definitions/Frame"}
