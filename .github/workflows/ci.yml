name: Legacy CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: openapi-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: openapi-client
      # Only the protocol-neutral JSON leaves are consumed. This exact source
      # pin qualifies unreleased artifacts without publishing SDK packages.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/openbindings-ts
          ref: c53ef707ca1170c705775532fd30a8d7e87e3e5e
          path: openbindings-ts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: openapi-client/pnpm-lock.yaml
      - name: Build neutral JSON prerequisites
        run: |
          pnpm --dir ../openbindings-ts install --frozen-lockfile --ignore-scripts
          pnpm --dir ../openbindings-ts --filter @openbindings/json --filter @openbindings/json-schema build
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: openapi-client/go/go.mod
          cache-dependency-path: openapi-client/go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm qualify:release
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -race ./...
        working-directory: go
        env:
          GOWORK: "off"
      - name: Check JSON Schema output with an independent evaluator
        run: go test -race ./...
        working-directory: go/jsonschematest
        env:
          GOWORK: "off"
      - name: Exercise octal word boundaries on 32-bit Go
        run: go test ./openapi -run '^TestYAMLOctalValuesExact$'
        working-directory: go
        env:
          GOWORK: "off"
          GOARCH: "386"
  go-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
      - name: Verify native Windows drive and file URI loading
        run: go test ./openapi -run '^TestWindowsPathEntryURIs$' -v
        working-directory: go
        env:
          GOWORK: "off"
      # Short mode retains functional and allocation checks. The full Linux
      # race job owns timing gates; this runner quantizes short samples to zero.
      - run: go test -short ./... -timeout 10m
        working-directory: go
        env:
          GOWORK: "off"
